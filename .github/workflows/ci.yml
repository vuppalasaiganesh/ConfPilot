name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest ruff pyyaml
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Validate configs
        run: |
          docker compose config -q
          python -c "import yaml; [d for d in yaml.safe_load_all(open('k8s/confpilot.yaml'))]"
          bash -n start.sh scripts/k8s.sh scripts/chaos.sh

  integration:
    # Real Elasticsearch: ingest the data, start the API and run a smoke test.
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      elasticsearch:
        image: elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"
          --health-interval 5s --health-retries 40
    env:
      ES_URL: http://localhost:9200
      EMBEDDINGS: hash   # fast and offline; the real model is exercised locally
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest
        run: python -m scripts.ingest
      - name: Smoke test the API
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 1; done
          curl -fs localhost:8000/readyz
          curl -fs -X POST localhost:8000/api/plan -H 'content-type: application/json' \
            -d '{"profile":"SRE into OpenTelemetry and eBPF"}' | python -c "
          import json, sys
          d = json.load(sys.stdin)
          agenda = d['agenda']
          assert len(agenda) >= 3, 'agenda too short'
          for i, a in enumerate(agenda):
              for b in agenda[i + 1:]:
                  assert not (a['start'] < b['end'] and b['start'] < a['end']), 'clash: ' + a['id'] + ' ' + b['id']
          print('plan ok:', len(agenda), 'talks')"
          curl -fs -X POST localhost:8000/api/chat -H 'content-type: application/json' \
            -d '{"message":"who is speaking about GPUs?","agenda_ids":[]}' | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['suggestions'], 'no suggestions'
          print('chat ok')"
