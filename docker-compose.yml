name: confpilot

services:
  elasticsearch:
    image: elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      retries: 40

  ingest:
    build: .
    image: confpilot:local
    command: ["python", "-m", "scripts.ingest"]
    env_file:
      - path: .env
        required: false
    environment: [ES_URL=http://elasticsearch:9200]
    depends_on:
      elasticsearch: { condition: service_healthy }

  app:
    image: confpilot:local
    pull_policy: never
    env_file:
      - path: .env
        required: false
    environment:
      - ES_URL=http://elasticsearch:9200
      # Set by "./start.sh tracing"; empty means tracing is off.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=confpilot
    ports: ["8000:8000"]
    depends_on:
      ingest: { condition: service_completed_successfully }
    restart: unless-stopped

  # Optional: "./start.sh tracing" starts this too. Open http://localhost:16686 to see traces.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [tracing]
    ports: ["16686:16686"]
