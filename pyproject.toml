[project]
name = "confpilot"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B905"]  # lambdas are fine; zip() lengths are checked by tests

[tool.pytest.ini_options]
testpaths = ["tests"]
